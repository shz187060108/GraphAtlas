base_config: configs/base.yaml
reporting:
  target_model: graphatlas_c
seeds:
- 0
- 1
- 2
train:
  mode: hetero_neighbor
  batch_size: 256
  neighbor_sizes:
  - 20
  - 15
  target_batching: true
datasets:
- name: h2gb_pdns
  num_charts: 4
  heterogeneous: true
  target_node_type: domain_node
  metric: f1
- name: h2gb_ieee_cis
  num_charts: 4
  heterogeneous: true
  target_node_type: transaction
  metric: f1
models:
- name: atn
  label: atn
  heterogeneous: true
- name: atn
  label: atn_beta_zero
  heterogeneous: true
  transportability_beta: 0.0
- name: atn
  label: atn_no_stop_gradient
  heterogeneous: true
  transportability_stop_gradient: false
- name: atn
  label: atn_membership
  heterogeneous: true
  certified_routing_mode: membership_only
- name: atn
  label: atn_min_distortion
  heterogeneous: true
  transport_mode: min_distortion
- name: atn
  label: atn_original
  heterogeneous: true
  transport_mode: original
