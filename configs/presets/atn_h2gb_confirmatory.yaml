  metric: f1
models:
- name: mlp_typed
  label: mlp_typed
  heterogeneous: true
- name: gcn_homogeneous_projection
  label: gcn_homogeneous_projection
  heterogeneous: true
- name: rgcn
  label: rgcn
  heterogeneous: true
- name: hgt
  label: hgt
  heterogeneous: true
- name: graphatlas_typed
  label: graphatlas_typed
  heterogeneous: true
- name: atn
  label: atn
  heterogeneous: true
