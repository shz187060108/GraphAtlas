base_config: configs/base.yaml

seeds:
  - 0

train:
  device: cuda
  epochs: 100
  patience: 20
  eval_every: 5
  progress: true
  resume: true
  neighbor_sampling: true
  batch_size: 1024
  num_neighbors: [15]
  num_workers: 0

model:
  name: graphatlas
  hidden_dim: 64
  observation_dim: 16
  chart_dim: 4
  vector_channels: 4
  num_charts: 4
  num_layers: 1
  edge_chunk_size: 100000

datasets:
  - {name: ogbn_arxiv, num_charts: 4}
  - {name: ogbn_products, num_charts: 4}
  - {name: ogbn_proteins, num_charts: 4, metric: roc_auc}

models:
  - {name: graphatlas}
