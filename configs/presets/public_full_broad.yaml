base_config: configs/base.yaml
seeds: [0, 1, 2]

train:
  device: cuda
  epochs: 200
  patience: 40
  eval_every: 5
  regularization_every: 5
  progress: true
  resume: true

loss:
  geometry: 0.0
  inverse_cycle: 0.01
  path_consistency: 0.02
  metric: 0.02
  chart_rank: 0.01
  metric_probes: 4
  sample_nodes: 128

datasets:
  - {name: roman_empire, num_charts: 4}
  - {name: amazon_ratings, num_charts: 4}
  - {name: minesweeper, num_charts: 4, metric: roc_auc}
  - {name: tolokers, num_charts: 4, metric: roc_auc}
  - {name: questions, num_charts: 4, metric: roc_auc}
  - {name: actor, num_charts: 4}
  - {name: chameleon_filtered, num_charts: 4}
  - {name: squirrel_filtered, num_charts: 4}
  - {name: cora, num_charts: 4}
  - {name: citeseer, num_charts: 4}
  - {name: pubmed, num_charts: 4}
  - {name: wikics, num_charts: 4}
  - {name: cornell, num_charts: 4}
  - {name: texas, num_charts: 4}
  - {name: wisconsin, num_charts: 4}

models:
  - {name: graphatlas}
