base_config: configs/base.yaml
seeds: [0, 1, 2]
train:
  epochs: 100
  patience: 25
  eval_every: 2
  progress: true
  regularization_every: 5
  num_threads: 1
loss:
  reconstruction: 0.05
  cocycle: 0.01
  metric: 0.01
  cover: 0.01
  balance: 0.005
  sparsity: 0.005
  geometry: 0.01
  sample_nodes: 64
datasets:
  - name: atlas_het
    num_nodes: 360
    num_charts: 3
    feature_dim: 16
    knn: 6
    relation_edges_per_node: 2
    heterophily: 0.78
    overlap: 0.28
    coordinate_shift_strength: 0.80
models:
  - {name: graphatlas, label: original, hidden_dim: 40, observation_dim: 8, vector_channels: 4, num_layers: 1, dropout: 0.05, jacobian_chunk_size: 256}
  - {name: graphatlas_min_distortion, label: min_distortion, hidden_dim: 40, observation_dim: 8, vector_channels: 4, num_layers: 1, dropout: 0.05, jacobian_chunk_size: 256}
  - {name: graphatlas_certified, label: certified_beta_0, transportability_beta: 0.0, hidden_dim: 40, observation_dim: 8, vector_channels: 4, num_layers: 1, dropout: 0.05, jacobian_chunk_size: 256}
  - {name: graphatlas_certified, label: certified_beta_1, transportability_beta: 1.0, hidden_dim: 40, observation_dim: 8, vector_channels: 4, num_layers: 1, dropout: 0.05, jacobian_chunk_size: 256}
