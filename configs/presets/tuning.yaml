base_config: configs/base.yaml
seeds:
- 0
- 1
- 2
train:
  epochs: 250
  patience: 50
  eval_every: 5
  progress: true
  num_threads: 1
datasets:
- name: roman_empire
  num_charts: 4
- name: amazon_ratings
  num_charts: 4
- name: minesweeper
  num_charts: 4
  metric: roc_auc
- name: cora
  num_charts: 3
models:
- name: graphatlas
  label: graphatlas_c4_v4
  hidden_dim: 64
  vector_channels: 4
  dropout: 0.05
- name: graphatlas
  label: graphatlas_c4_v6
  hidden_dim: 64
  vector_channels: 6
  dropout: 0.05
- name: graphatlas
  label: graphatlas_h128_v6
  hidden_dim: 128
  vector_channels: 6
  dropout: 0.1
