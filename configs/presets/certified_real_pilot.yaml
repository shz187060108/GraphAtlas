base_config: configs/base.yaml
seeds: [0]
train:
  epochs: 250
  patience: 50
  eval_every: 5
  progress: true
  num_threads: 1
loss:
  sample_nodes: 192
datasets:
  - {name: cornell, num_charts: 3}
  - {name: texas, num_charts: 3}
  - {name: wisconsin, num_charts: 3}
  - {name: chameleon_filtered, num_charts: 4}
  - {name: squirrel_filtered, num_charts: 4}
  - {name: cora, num_charts: 3}
  - {name: citeseer, num_charts: 3}
  - {name: actor, num_charts: 4}
  - {name: minesweeper, num_charts: 4, metric: roc_auc}
  - {name: wikics, num_charts: 4}
  - {name: tolokers, num_charts: 4, metric: roc_auc}
  - {name: dblp, num_charts: 4}
  - {name: coauthor_cs, num_charts: 4}
  - {name: pubmed, num_charts: 3}
  - {name: roman_empire, num_charts: 4}
  - {name: amazon_ratings, num_charts: 4}
  - {name: coauthor_physics, num_charts: 4}
  - {name: questions, num_charts: 4, metric: roc_auc}
  - {name: ogbn_arxiv, num_charts: 8, metric: accuracy}
  - {name: ogbn_proteins, num_charts: 8, metric: roc_auc, feature_source: native}
  - {name: ogbn_products, num_charts: 8, metric: accuracy}
models:
  - {name: graphatlas, label: original}
  - {name: graphatlas_min_distortion, label: min_distortion}
  - {name: graphatlas_certified, label: certified_beta_1, transportability_beta: 1.0}
