dataset:
  name: roman_empire
  root: data
  num_nodes: 800
  num_charts: 4
  latent_dim: 2
  feature_dim: 16
  num_classes: 3
  overlap: 0.22
  heterophily: 0.7
  relation_edges_per_node: 2
  knn: 8
  noise: 0.05
  coordinate_shift_strength: 0.8
  split: 0
  task: node_classification
  link_val_ratio: 0.1
  link_test_ratio: 0.1
  negative_ratio: 1.0
  local_path: null
  format: auto
  metric: null
  target_node_type: null
  feature_source: native
  directed: false
  max_nodes: null
  enabled: true
model:
  name: graphatlas_free_transition
  hidden_dim: 64
  observation_dim: 12
  chart_dim: 2
  vector_channels: 6
  num_charts: 4
  num_layers: 1
  dropout: 0.05
  membership_topk: 2
  jacobian_chunk_size: 2048
  propagation_steps: 10
  teleport: 0.1
  attention_heads: 4
  alpha: 0.1
  theta: 0.5
  label: null
loss:
  task: 1.0
  reconstruction: 0.05
  cocycle: 0.01
  inverse_cycle: 0.01
  path_consistency: 0.02
  metric: 0.02
  metric_probes: 4
  metric_scale_weight: 0.1
  chart_rank: 0.01
  rank_margin: 0.2
  rank_max_condition: 20.0
  rank_condition_weight: 0.05
  cover: 0.01
  balance: 0.005
  sparsity: 0.005
  geometry: 0.0
  sample_nodes: 256
train:
  seed: 0
  device: auto
  epochs: 500
  patience: 80
  learning_rate: 0.003
  weight_decay: 0.0005
  grad_clip: 5.0
  progress: true
  eval_every: 5
  regularization_every: 10
  light_regularization_nodes: 48
  light_metric_probes: 2
  output_dir: outputs/runs
  num_threads: 1
  resume: true
