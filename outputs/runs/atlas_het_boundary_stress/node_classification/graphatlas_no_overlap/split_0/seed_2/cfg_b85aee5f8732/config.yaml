dataset:
  name: atlas_het_boundary_stress
  root: data
  num_nodes: 1000
  num_charts: 5
  latent_dim: 2
  feature_dim: 16
  num_classes: 3
  overlap: 0.45
  heterophily: 0.7
  relation_edges_per_node: 2
  knn: 8
  noise: 0.05
  coordinate_shift_strength: 0.8
  split: 0
  task: node_classification
  link_val_ratio: 0.1
  link_test_ratio: 0.1
  negative_ratio: 1.0
  local_path: null
  format: auto
  metric: null
  target_node_type: null
  feature_source: native
  directed: false
  max_nodes: null
  enabled: true
  atlas_variant: boundary_stress
  surface_positive_amplitude: 0.55
  surface_negative_amplitude: 0.55
  surface_region_width: 0.85
  cross_chart_edge_fraction: 0.5
  geodesic_pair_count: 512
  intrinsic_candidate_neighbors: 24
model:
  name: graphatlas_no_overlap
  hidden_dim: 64
  observation_dim: 12
  chart_dim: 2
  vector_channels: 6
  num_charts: 5
  num_layers: 1
  dropout: 0.05
  membership_topk: 2
  jacobian_chunk_size: 2048
  propagation_steps: 10
  teleport: 0.1
  attention_heads: 4
  alpha: 0.1
  theta: 0.5
  label: null
loss:
  task: 1.0
  reconstruction: 0.05
  cocycle: 0.01
  inverse_cycle: 0.01
  path_consistency: 0.02
  metric: 0.02
  metric_probes: 4
  metric_scale_weight: 0.1
  chart_rank: 0.01
  rank_margin: 0.2
  rank_max_condition: 20.0
  rank_condition_weight: 0.05
  cover: 0.01
  balance: 0.005
  sparsity: 0.005
  geometry: 0.01
  sample_nodes: 128
train:
  seed: 2
  device: cuda
  epochs: 200
  patience: 40
  learning_rate: 0.003
  weight_decay: 0.0005
  grad_clip: 5.0
  progress: true
  eval_every: 5
  regularization_every: 5
  light_regularization_nodes: 32
  light_metric_probes: 2
  output_dir: outputs/runs
  num_threads: 1
  resume: true
